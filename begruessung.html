<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <!--<link rel="stylesheet" href="style.css">-->
<link rel='stylesheet' href='https://fonts.googleapis.com/css?family=Parisienne'>
  <title>Tervetuloa</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
	  background-color: #d04d65;
    }

    #begruessung {
left: 50%;
 transform: translateX(-50%);

      position: fixed;
      top: 0;
      width: 100%;
      text-align: center;
      
      font-size: 60px;
      z-index: 9999;
	  font-family: "Parisienne"!important;
	  background-color: #d04d65;
	  color:white;
	  font-weight: bold;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 10000;
    }
  </style>
</head>
<body  class="katinka-crimson">
  <div id="begruessung" class="katinka-display-container"><h2>Tervetuloa<br>suomen kielen<br>puhuja !</h2></div>
  <canvas id="canvas" class="katinka-crimson"></canvas>

  <script>
    window.addEventListener('load', () => {
      const begruessung = document.getElementById('begruessung');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      setTimeout(() => {
        const rect = begruessung.getBoundingClientRect();
        const particles = [];

        // Screenshot vom Text
        html2canvas(begruessung).then(screenshot => {
          const imgData = screenshot.getContext('2d').getImageData(0, 0, screenshot.width, screenshot.height);

          for (let y = 0; y < imgData.height; y += 4) {
            for (let x = 0; x < imgData.width; x += 4) {
              const i = (y * imgData.width + x) * 4;
              const r = imgData.data[i];
              const g = imgData.data[i + 1];
              const b = imgData.data[i + 2];
              const a = imgData.data[i + 3];

              if (a > 0) {
                particles.push({
                  x: rect.left-150 + x,
                  y: rect.top -40+ y,
                  vx: (Math.random() - 0.5) * 3,
                  vy: (Math.random() - 0.5) * 3,
				  
                  alpha: 1,
                  color: `rgba(${r},${g},${b},`
                });
              }
            }
          }
console.log(begruessung)
          begruessung.remove();
		  
window.parent.postMessage('intro-finished', '*');

          function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
              p.x += p.vx;
              p.y += p.vy;
              p.alpha -= 0.005;
              if (p.alpha > 0) {
                ctx.fillStyle = p.color + p.alpha + ')';
                ctx.fillRect(p.x, p.y, 2, 2);
              }
            });
            requestAnimationFrame(animate);
          }

          animate();
        });
      }, 2000);
    });
  </script>

  <!-- html2canvas für Screenshot -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</body>
</html>
